<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>กำลังเชื่อมต่อ OneDrive…</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;
       font-family:'Noto Sans Thai','Leelawadee UI',-apple-system,system-ui,Arial,sans-serif;
       background:#f8fafc;color:#334155}
  @media(prefers-color-scheme:dark){body{background:#090d16;color:#cbd5e1}}
  .spin{width:32px;height:32px;margin:0 auto 16px;border:3px solid rgba(128,128,128,.3);
        border-top-color:#2563eb;border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .err{color:#dc2626;max-width:420px;padding:0 20px;line-height:1.6}
  a{color:#2563eb}
</style>
</head>
<body>
<div>
  <div class="spin" id="spin"></div>
  <div id="msg">กำลังเชื่อมต่อ OneDrive…</div>
</div>
<script>
(function () {
  var KEY_CODE = 'ds_ms_code_v1';
  var KEY_PKCE = 'ds_ms_pkce_v1';
  var q = new URLSearchParams(location.search);

  var payload = {
    type             : 'ds-ms-auth',
    code             : q.get('code') || '',
    state            : q.get('state') || '',
    error            : q.get('error') || '',
    error_description: q.get('error_description') || '',
  };

  /* เปิดมาจากหน้าต่างเล็ก — ส่งผลกลับไปให้หน้าหลักแล้วปิดตัวเอง */
  if (window.opener && window.opener !== window) {
    try {
      window.opener.postMessage(payload, location.origin);
      window.close();
      return;
    } catch (e) { /* ตกไปใช้แบบ redirect ด้านล่าง */ }
  }

  /* เปิดมาแบบเปลี่ยนหน้าทั้งหน้า — พักผลไว้แล้วกลับไปหน้าเดิม */
  var back = 'index.html';
  try {
    var pkce = JSON.parse(sessionStorage.getItem(KEY_PKCE) || 'null');
    if (pkce && pkce.returnTo) back = pkce.returnTo;
    sessionStorage.setItem(KEY_CODE, JSON.stringify(payload));
  } catch (e) {}

  if (payload.error && !payload.code) {
    document.getElementById('spin').style.display = 'none';
    document.getElementById('msg').className = 'err';
    document.getElementById('msg').innerHTML =
      '<b>เชื่อมต่อ OneDrive ไม่สำเร็จ</b><br>' +
      (payload.error_description || payload.error) +
      '<br><br><a href="' + back.replace(/"/g, '&quot;') + '">กลับไปที่โปรแกรม</a>';
    return;
  }
  location.replace(back);
})();
</script>
</body>
</html>
